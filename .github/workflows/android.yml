name: Android

# Каждый PR и push в main собирают подписанный release APK (артефакт сборки).
# Push в main с новой versionName публикует GitHub Release vX.Y с MotionCues.apk.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Релиз не прерываем: иначе может остаться недоопубликованный черновик
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Read version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+).*/\1/p' app/build.gradle.kts)
          # Не через &&: bash -e не останавливается на провале не последней команды списка
          [ -n "$name" ] || { echo "::error::versionName не найден в app/build.gradle.kts"; exit 1; }
          [ -n "$code" ] || { echo "::error::versionCode не найден в app/build.gradle.kts"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "MotionCues-$name.apk"
          echo "Motion Cues $name (versionCode $code)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MotionCues-${{ steps.version.outputs.name }}
          path: MotionCues-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MotionCues-${{ needs.build.outputs.version }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::notice::Релиз $tag уже есть. Чтобы выпустить новый, подними versionCode/versionName в app/build.gradle.kts"
            exit 0
          fi
          if [ "$draft" = "true" ]; then
            # Черновик остаётся, если прошлый запуск упал на загрузке APK, — публикуем заново
            gh release delete "$tag" --yes
          fi
          # Постоянное имя файла: .../releases/latest/download/MotionCues.apk всегда ведёт на свежую версию
          mv "MotionCues-$VERSION.apk" MotionCues.apk
          gh release create "$tag" MotionCues.apk \
            --target "$GITHUB_SHA" \
            --title "Motion Cues $VERSION" \
            --generate-notes
